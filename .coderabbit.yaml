# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: assertive
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    ignore_usernames: []
  path_filters:
    - "!artifacts/**"
    - "!dist/**"
    - "!node_modules/**"
    - "!src-tauri/target/**"
    - "!.worktrees/**"
chat:
  auto_reply: true
