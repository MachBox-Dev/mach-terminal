[package]
name = "mach-terminal-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process"] }
dirs = "6"
url = "2"

[dev-dependencies]
tempfile = "3"
